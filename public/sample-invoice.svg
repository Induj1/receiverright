    <text x="128" y="72" font-size="23" font-weight="700" fill="#163c35">LAKEVIEW</text>
    <text x="128" y="96" font-size="14" letter-spacing="3" fill="#61716a">DISTRIBUTORS</text>
    <text x="782" y="73" text-anchor="end" font-size="30" font-weight="700" fill="#172f2b">INVOICE</text>
    <text x="782" y="100" text-anchor="end" font-size="14" fill="#67746e">DEMO-2026-042</text>
    <path d="M58 133h724" stroke="#d7dfd4"/>
    <text x="58" y="166" font-size="11" font-weight="700" letter-spacing="1.8" fill="#78827a">BILL TO</text>
    <text x="58" y="195" font-size="23" font-weight="700" fill="#213c33">Corner Basket</text>
    <text x="58" y="221" font-size="14" fill="#69756c">Neighbourhood essentials shop</text>
    <text x="58" y="245" font-size="14" fill="#69756c">Demo address · Bengaluru</text>
    <text x="536" y="166" font-size="11" font-weight="700" letter-spacing="1.8" fill="#78827a">INVOICE DETAILS</text>
    <text x="536" y="196" font-size="14" fill="#69756c">Date issued</text>
    <text x="782" y="196" text-anchor="end" font-size="14" font-weight="700" fill="#213c33">20 Sep 2026</text>
    <text x="536" y="226" font-size="14" fill="#69756c">Currency</text>
    <text x="782" y="226" text-anchor="end" font-size="14" font-weight="700" fill="#213c33">INR</text>
    <rect x="58" y="280" width="724" height="58" rx="9" fill="#f3f4e9"/>
    <circle cx="79" cy="309" r="5" fill="#af7b23"/>
