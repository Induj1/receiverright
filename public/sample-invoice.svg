<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1080" viewBox="0 0 840 1080" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic invoice DEMO-2026-042</title>
  <desc id="desc">Lakeview Distributors demo invoice for Corner Basket. Twelve water bottles at 100 rupees, 24 biscuit packets at 40 rupees, and one carton of tea at 1200 rupees. Total 3360 rupees. Tax excluded. Synthetic sample, not a real invoice.</desc>
  <rect width="840" height="1080" rx="10" fill="#fffefa"/>
  <path d="M0 0h840v14H0z" fill="#174f46"/>
  <g font-family="Arial, Helvetica, sans-serif">
