    <g fill="#fffefa" font-size="11" font-weight="700" letter-spacing="0.5">
      <text x="76" y="378">ITEM / SKU</text><text x="465" y="378" text-anchor="end">QTY</text><text x="525" y="378">UNIT</text><text x="671" y="378" text-anchor="end">RATE (INR)</text><text x="763" y="378" text-anchor="end">AMOUNT</text>
    </g>
    <g fill="#213c33" font-size="15">
      <text x="76" y="421" font-weight="700">Clear Spring water · 1 L</text><text x="76" y="444" font-size="11" fill="#7b857c">BTL100</text>
      <text x="465" y="431" text-anchor="end">12</text><text x="525" y="431">unit</text><text x="671" y="431" text-anchor="end">100.00</text><text x="763" y="431" text-anchor="end" font-weight="700">1,200.00</text>
      <path d="M58 462h724" stroke="#e2e5da"/>
      <text x="76" y="491" font-weight="700">Golden oat biscuits · 150 g</text><text x="76" y="514" font-size="11" fill="#7b857c">BIS040</text>
      <text x="465" y="501" text-anchor="end">24</text><text x="525" y="501">unit</text><text x="671" y="501" text-anchor="end">40.00</text><text x="763" y="501" text-anchor="end" font-weight="700">960.00</text>
      <path d="M58 532h724" stroke="#e2e5da"/>
      <text x="76" y="561" font-weight="700">Everyday tea · 100 g</text><text x="76" y="584" font-size="11" fill="#7b857c">TEA120</text>
      <text x="465" y="571" text-anchor="end">1</text><text x="525" y="571">carton</text><text x="671" y="571" text-anchor="end">1,200.00</text><text x="763" y="571" text-anchor="end" font-weight="700">1,200.00</text>
      <path d="M58 602h724" stroke="#c4d0c3"/>
