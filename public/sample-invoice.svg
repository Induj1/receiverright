    <text x="536" y="641" font-size="14" fill="#687869">Subtotal</text><text x="763" y="641" text-anchor="end" font-size="15" fill="#213c33">3,360.00</text>
    <text x="536" y="675" font-size="14" fill="#687869">Taxes / discounts</text><text x="763" y="675" text-anchor="end" font-size="13" fill="#687869">Not modeled</text>
