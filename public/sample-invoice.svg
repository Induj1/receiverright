    <text x="58" y="916" font-size="13" fill="#738073">Count received units, separate damaged or wrong items, and confirm billed pack sizes.</text>
    <text x="58" y="939" font-size="13" fill="#738073">The invoice states billed quantities. It does not independently verify what arrived.</text>
    <rect x="58" y="985" width="724" height="43" rx="6" fill="#f1f2e9"/>
    <text x="79" y="1012" font-size="11" letter-spacing="1" fill="#7b8477">RECEIVERIGHT / DEMO EVIDENCE</text><text x="763" y="1012" text-anchor="end" font-size="11" fill="#7b8477">1 / 1</text>
